experiment_name: AugmentInvert
run_name: default
seed: 42
verbose: true

data_contents: 'all'

model: {
  class: FIMFScoreCAM,
  kwargs: {}
}
backbone: {
  class: VGG,
  kwargs: {
    pretrain: true
  }
}
classifier: {
  class: Conv,
  kwargs: {}
}
projection: duplicate
augment:
  - geometric
  # - zoom
  - color
  - blur
  # - erasing

batch_size: 32
epochs: 50
lr: 1e-3            
wd: 1e-4
threshold: 0.7
